# /srv/tallyview/dashboards.yaml
dashboards:
  # ==============================================================================
  # 1. 资产与净值总览大屏
  # ==============================================================================
  - name: 📊 资产总览
    panels:
      - title: 资产净值走势 (Net Worth Trend)
        type: echarts
        width: 100%
        height: 360px
        script: |
          const data = await fava.query("SELECT date, sum(cost(position)) WHERE account ~ '^Assets|^Liabilities' GROUP BY date ORDER BY date");
          const dates = data.map(r => r.date);
          const values = data.map(r => Number(r.sum_cost_position.toFixed(2)));
          return {
            tooltip: { trigger: 'axis', formatter: '{b}<br/>净资产: <b>¥{c}</b>' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', boundaryGap: false, data: dates },
            yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
            series: [{
              name: '净资产',
              type: 'line',
              smooth: true,
              showSymbol: false,
              data: values,
              lineStyle: { width: 3, color: '#2563eb' },
              areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                  { offset: 0, color: 'rgba(37, 99, 235, 0.35)' },
                  { offset: 1, color: 'rgba(37, 99, 235, 0.02)' }
                ])
              }
            }]
          };

      - title: 资产账户结构分布
        type: echarts
        width: 50%
        height: 320px
        script: |
          const data = await fava.query("SELECT root(account, 3) as acc, sum(cost(position)) as total WHERE account ~ '^Assets' GROUP BY acc ORDER BY total DESC");
          const pieData = data.map(r => ({ name: r.acc.replace('Assets:', ''), value: Math.abs(Number(r.total.toFixed(2))) }));
          return {
            tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
            legend: { orient: 'vertical', left: 'left', textStyle: { fontSize: 11 } },
            series: [{
              type: 'pie',
              radius: ['45%', '70%'],
              avoidLabelOverlap: false,
              itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
              label: { show: false },
              data: pieData
            }]
          };

      - title: 负债与未结清账款
        type: echarts
        width: 50%
        height: 320px
        script: |
          const data = await fava.query("SELECT root(account, 3) as acc, sum(cost(position)) as total WHERE account ~ '^Liabilities' GROUP BY acc ORDER BY total ASC");
          const pieData = data.map(r => ({ name: r.acc.replace('Liabilities:', ''), value: Math.abs(Number(r.total.toFixed(2))) }));
          return {
            tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
            legend: { orient: 'vertical', left: 'left', textStyle: { fontSize: 11 } },
            series: [{
              type: 'pie',
              radius: ['45%', '70%'],
              avoidLabelOverlap: false,
              itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
              label: { show: false },
              data: pieData
            }]
          };

  # ==============================================================================
  # 2. 资金流向全景 (Sankey 桑基图)
  # ==============================================================================
  - name: 🌊 资金流向
    panels:
      - title: 收入 ➔ 核心支出 ➔ 储蓄资产沉淀
        type: echarts
        width: 100%
        height: 520px
        script: |
          const incData = await fava.query("SELECT sum(cost(position)) as total WHERE account ~ '^Income'");
          const expData = await fava.query("SELECT root(account, 2) as cat, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY cat");
          const totalIncome = Math.abs(incData[0]?.total || 0);
          
          const nodes = [{ name: '总收入' }];
          const links = [];
          let totalExpense = 0;

          expData.forEach(r => {
            const val = Math.abs(Number(r.total.toFixed(2)));
            if (val > 0) {
              const name = r.cat.replace('Expenses:', '支出:');
              nodes.push({ name: name });
              links.push({ source: '总收入', target: name, value: val });
              totalExpense += val;
            }
          });

          const savings = totalIncome > totalExpense ? Number((totalIncome - totalExpense).toFixed(2)) : 0;
          if (savings > 0) {
            nodes.push({ name: '结余储蓄' });
            links.push({ source: '总收入', target: '结余储蓄', value: savings });
          }

          return {
            tooltip: { trigger: 'item', triggerOn: 'mousemove', formatter: '{b}: ¥{c}' },
            series: [{
              type: 'sankey',
              layout: 'none',
              emphasis: { focus: 'adjacency' },
              nodeWidth: 20,
              nodeGap: 14,
              data: nodes,
              links: links,
              lineStyle: { color: 'gradient', curveness: 0.5 }
            }]
          };

  # ==============================================================================
  # 3. 月度收支与分类洞察
  # ==============================================================================
  - name: 📈 月度收支
    panels:
      - title: 月度收支对比与结余走势
        type: echarts
        width: 100%
        height: 380px
        script: |
          const exp = await fava.query("SELECT year, month, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY year, month ORDER BY year, month");
          const inc = await fava.query("SELECT year, month, sum(cost(position)) as total WHERE account ~ '^Income' GROUP BY year, month ORDER BY year, month");
          
          const months = exp.map(r => `${r.year}-${String(r.month).padStart(2, '0')}`);
          const expValues = exp.map(r => Math.abs(Number(r.total.toFixed(2))));
          const incValues = months.map(m => {
            const row = inc.find(r => `${r.year}-${String(r.month).padStart(2, '0')}` === m);
            return row ? Math.abs(Number(row.total.toFixed(2))) : 0;
          });

          return {
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: { data: ['收入', '支出'] },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', data: months },
            yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
            series: [
              { name: '收入', type: 'bar', data: incValues, itemStyle: { color: '#10b981', borderRadius: [4, 4, 0, 0] } },
              { name: '支出', type: 'bar', data: expValues, itemStyle: { color: '#ef4444', borderRadius: [4, 4, 0, 0] } }
            ]
          };

  # ==============================================================================
  # 4. 消费行为热力图与成员统计
  # ==============================================================================
  - name: 🔥 消费热力图
    panels:
      - title: 全年每日支出频次与金额热力图 (GitHub 风格)
        type: echarts
        width: 100%
        height: 240px
        script: |
          const data = await fava.query("SELECT date, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY date");
          const points = data.map(r => [r.date, Math.abs(Number(r.total.toFixed(2)))]);
          return {
            tooltip: { position: 'top', formatter: (p) => `${p.value[0]}<br/>支出: ¥${p.value[1]}` },
            visualMap: { min: 0, max: 1000, type: 'piecewise', orient: 'horizontal', left: 'center', top: 0, inRange: { color: ['#dbeafe', '#93c5fd', '#3b82f6', '#1d4ed8'] } },
            calendar: { top: 45, left: 30, right: 30, range: '2026', splitLine: { show: true, lineStyle: { color: '#f3f4f6' } }, yearLabel: { show: false } },
            series: { type: 'heatmap', coordinateSystem: 'calendar', data: points }
          };