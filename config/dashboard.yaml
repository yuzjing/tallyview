              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 25, containLabel: true },
              xAxis: { type: 'category', data: channels.length ? channels : ['无欠款'] },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList.length ? seriesList : [{ type: 'bar', data: [0] }]
            };
          } catch (e) {
            return { series: [] };
          }

  # ==============================================================================
  # 2. 资金流向全景 (带家庭成员流向枢纽)
  # ==============================================================================
  - name: "Flow · 资金流向 🌊"
    panels:
      - title: 收入 ➔ 家庭成员分流 ➔ 核心支出大类 ➔ 结余沉淀
        type: echarts
        width: 100%
        height: 520px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const incData = await safeQuery("SELECT sum(cost(position)) as total WHERE account ~ '^Income'");
            const totalIncome = Math.abs(parseNum(incData?.[0]?.total));

            // ⭐️ 核心 1：按成员和支出大类联合聚合
            const expData = await safeQuery("SELECT root(account, 2) as cat, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY cat, owner");

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const nodes = [{ name: '💰 家庭总收入' }];
            const links = [];
            let totalExpense = 0;

            const memExpenseMap = {};
            members.forEach(m => memExpenseMap[m.toLowerCase()] = 0);

            expData.forEach(r => {
              const val = Math.abs(Math.round(parseNum(r.total) * 100) / 100);
              if (val > 0) {
                totalExpense += val;
                const own = (r.owner || members[0] || '默认').toLowerCase();
                memExpenseMap[own] = (memExpenseMap[own] || 0) + val;

                const catName = r.cat.replace('Expenses:', '支出:');
                if (!nodes.find(n => n.name === catName)) nodes.push({ name: catName });
                
                // 连线：成员 ➔ 具体消费大类
                const memLabel = `👤 ${own.toUpperCase()}`;
                if (!nodes.find(n => n.name === memLabel)) nodes.push({ name: memLabel });
                links.push({ source: memLabel, target: catName, value: val });
              }
            });

            // 连线：总收入 ➔ 各家庭成员
            members.forEach(m => {
              const memSpent = memExpenseMap[m.toLowerCase()] || 0;
              if (memSpent > 0) {
                links.push({ source: '💰 家庭总收入', target: `👤 ${m.toUpperCase()}`, value: memSpent });
              }
            });

            // 结余部分
            const savings = totalIncome > totalExpense ? Math.round((totalIncome - totalExpense) * 100) / 100 : 0;
            if (savings > 0) {
              nodes.push({ name: '🏦 结余储蓄' });
              links.push({ source: '💰 家庭总收入', target: '🏦 结余储蓄', value: savings });
            }

            if (links.length === 0) {
              nodes.push({ name: '当前收入 (¥0)' }, { name: '暂无支出 (¥0)' });
              links.push({ source: '当前收入 (¥0)', target: '暂无支出 (¥0)', value: 0.001 });
            }

            return {
              tooltip: { trigger: 'item', triggerOn: 'mousemove', formatter: '{b}: ¥{c}' },
              series: [{
                type: 'sankey',
                layout: 'none',
                top: 40,
                bottom: 40,
                emphasis: { focus: 'adjacency' },
                nodeWidth: 20,
                nodeGap: 16,
                data: nodes,
                links: links,
                lineStyle: { color: 'gradient', curveness: 0.5 }
              }]
            };
          } catch (e) {
            return { series: [] };
          }

  # ==============================================================================
  # 3. 周期收支深度大盘 (周/月/季/半年 全景图表带家庭成员图例控制)
  # ==============================================================================
  - name: "Monthly · 周期收支 📈"
    panels:
      # --- 3.1 周度收支趋势 (支持成员独立筛选/堆叠) ---
      - title: 1. 周度收支 (支出按家庭成员堆叠/图例控制)
        type: echarts
        width: 50%
        height: 350px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const expData = await safeQuery("SELECT date, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY date, owner");
            const incData = await safeQuery("SELECT date, sum(cost(position)) as total WHERE account ~ '^Income' GROUP BY date");

            const getWeekLabel = (dStr) => {
              const d = new Date(dStr);
              const oneJan = new Date(d.getFullYear(), 0, 1);
              return `W${Math.ceil((((d - oneJan) / 86400000) + oneJan.getDay() + 1) / 7)}`;
            };

            const weekMap = {};
            expData.forEach(r => {
              const w = getWeekLabel(r.date);
              if (!weekMap[w]) weekMap[w] = { inc: 0 };
              const own = (r.owner || '其他').toLowerCase();
              weekMap[w][own] = (weekMap[w][own] || 0) + Math.abs(parseNum(r.total));
            });
            incData.forEach(r => {
              const w = getWeekLabel(r.date);
              if (!weekMap[w]) weekMap[w] = { inc: 0 };
              weekMap[w].inc += Math.abs(parseNum(r.total));
            });

            let weeks = Object.keys(weekMap).slice(-8);
            if (!weeks.length) { weeks = ['本周']; weekMap['本周'] = { inc: 0 }; }

            const memberColors = ['#f43f5e', '#f97316', '#ec4899', '#a855f7'];
            const seriesList = [
              {
                name: '💰 家庭收入',
                type: 'bar',
                barMaxWidth: 20,
                itemStyle: { color: '#10b981', borderRadius: [3, 3, 0, 0] },
                data: weeks.map(w => Math.round((weekMap[w]?.inc || 0) * 100) / 100)
              }
            ];

            members.forEach((m, idx) => {
              seriesList.push({
                name: `支出: ${m}`,
                type: 'bar',
                stack: 'weekExpense',
                barMaxWidth: 20,
                itemStyle: { color: memberColors[idx % memberColors.length], borderRadius: [2, 2, 0, 0] },
                data: weeks.map(w => Math.round((weekMap[w]?.[m.toLowerCase()] || 0) * 100) / 100)
              });
            });

            return {
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 20, containLabel: true },
              xAxis: { type: 'category', data: weeks },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList
            };
          } catch (e) {
            return { series: [] };
          }

      # --- 3.2 月度收支与结余 (支持成员独立筛选/堆叠) ---
      - title: 2. 月度收支 (支出按家庭成员堆叠/图例控制)
        type: echarts
        width: 50%
        height: 350px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const exp = await safeQuery("SELECT year, month, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY year, month, owner");
            const inc = await safeQuery("SELECT year, month, sum(cost(position)) as total WHERE account ~ '^Income' GROUP BY year, month");

            const monthMap = {};
            exp.forEach(r => {
              const mKey = `${r.year}-${String(r.month).padStart(2, '0')}`;
              if (!monthMap[mKey]) monthMap[mKey] = { inc: 0 };
              const own = (r.owner || '其他').toLowerCase();
              monthMap[mKey][own] = (monthMap[mKey][own] || 0) + Math.abs(parseNum(r.total));
            });
            inc.forEach(r => {
              const mKey = `${r.year}-${String(r.month).padStart(2, '0')}`;
              if (!monthMap[mKey]) monthMap[mKey] = { inc: 0 };
              monthMap[mKey].inc += Math.abs(parseNum(r.total));
            });

            let months = Object.keys(monthMap).sort().slice(-12);
            if (!months.length) { months = ['当月']; monthMap['当月'] = { inc: 0 }; }

            const memberColors = ['#f43f5e', '#f97316', '#ec4899', '#a855f7'];
            const seriesList = [
              {
                name: '💰 家庭收入',
                type: 'bar',
                barMaxWidth: 20,
                itemStyle: { color: '#10b981', borderRadius: [3, 3, 0, 0] },
                data: months.map(m => Math.round((monthMap[m]?.inc || 0) * 100) / 100)
              }
            ];

            members.forEach((m, idx) => {
              seriesList.push({
                name: `支出: ${m}`,
                type: 'bar',
                stack: 'monthExpense',
                barMaxWidth: 20,
                itemStyle: { color: memberColors[idx % memberColors.length] },
                data: months.map(mKey => Math.round((monthMap[mKey]?.[m.toLowerCase()] || 0) * 100) / 100)
              });
            });

            return {
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 20, containLabel: true },
              xAxis: { type: 'category', data: months },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList
            };
          } catch (e) {
            return { series: [] };
          }

      # --- 3.3 季度收支与储蓄洞察 ---
      - title: 3. 季度收支 (支出按家庭成员堆叠/图例控制)
        type: echarts
        width: 50%
        height: 350px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const exp = await safeQuery("SELECT year, month, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY year, month, owner");
            const inc = await safeQuery("SELECT year, month, sum(cost(position)) as total WHERE account ~ '^Income' GROUP BY year, month");

            const qMap = {};
            exp.forEach(r => {
              const qKey = `${r.year}-Q${Math.ceil(r.month / 3)}`;
              if (!qMap[qKey]) qMap[qKey] = { inc: 0 };
              const own = (r.owner || '其他').toLowerCase();
              qMap[qKey][own] = (qMap[qKey][own] || 0) + Math.abs(parseNum(r.total));
            });
            inc.forEach(r => {
              const qKey = `${r.year}-Q${Math.ceil(r.month / 3)}`;
              if (!qMap[qKey]) qMap[qKey] = { inc: 0 };
              qMap[qKey].inc += Math.abs(parseNum(r.total));
            });

            let quarters = Object.keys(qMap).sort();
            if (!quarters.length) { quarters = ['Q1', 'Q2', 'Q3', 'Q4']; quarters.forEach(q => qMap[q] = { inc: 0 }); }

            const memberColors = ['#f43f5e', '#f97316', '#ec4899', '#a855f7'];
            const seriesList = [
              {
                name: '💰 家庭收入',
                type: 'bar',
                barMaxWidth: 24,
                itemStyle: { color: '#10b981', borderRadius: [3, 3, 0, 0] },
                data: quarters.map(q => Math.round((qMap[q]?.inc || 0) * 100) / 100)
              }
            ];

            members.forEach((m, idx) => {
              seriesList.push({
                name: `支出: ${m}`,
                type: 'bar',
                stack: 'quarterExpense',
                barMaxWidth: 24,
                itemStyle: { color: memberColors[idx % memberColors.length] },
                data: quarters.map(q => Math.round((qMap[q]?.[m.toLowerCase()] || 0) * 100) / 100)
              });
            });

            return {
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 20, containLabel: true },
              xAxis: { type: 'category', data: quarters },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList
            };
          } catch (e) {
            return { series: [] };
          }

      # --- 3.4 半年度收支对比 ---
      - title: 4. 半年度收支 (支出按家庭成员堆叠/图例控制)
        type: echarts
        width: 50%
        height: 350px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const exp = await safeQuery("SELECT year, month, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY year, month, owner");
            const inc = await safeQuery("SELECT year, month, sum(cost(position)) as total WHERE account ~ '^Income' GROUP BY year, month");

            const hMap = {};
            exp.forEach(r => {
              const hKey = `${r.year} ${r.month <= 6 ? 'H1(上半年)' : 'H2(下半年)'}`;
              if (!hMap[hKey]) hMap[hKey] = { inc: 0 };
              const own = (r.owner || '其他').toLowerCase();
              hMap[hKey][own] = (hMap[hKey][own] || 0) + Math.abs(parseNum(r.total));
            });
            inc.forEach(r => {
              const hKey = `${r.year} ${r.month <= 6 ? 'H1(上半年)' : 'H2(下半年)'}`;
              if (!hMap[hKey]) hMap[hKey] = { inc: 0 };
              hMap[hKey].inc += Math.abs(parseNum(r.total));
            });

            let halfYears = Object.keys(hMap).sort();
            if (!halfYears.length) { halfYears = ['H1(上半年)', 'H2(下半年)']; halfYears.forEach(h => hMap[h] = { inc: 0 }); }

            const memberColors = ['#f43f5e', '#f97316', '#ec4899', '#a855f7'];
            const seriesList = [
              {
                name: '💰 家庭收入',
                type: 'bar',
                barMaxWidth: 28,
                itemStyle: { color: '#10b981', borderRadius: [3, 3, 0, 0] },
                data: halfYears.map(h => Math.round((hMap[h]?.inc || 0) * 100) / 100)
              }
            ];

            members.forEach((m, idx) => {
              seriesList.push({
                name: `支出: ${m}`,
                type: 'bar',
                stack: 'halfYearExpense',
                barMaxWidth: 28,
                itemStyle: { color: memberColors[idx % memberColors.length] },
                data: halfYears.map(h => Math.round((hMap[h]?.[m.toLowerCase()] || 0) * 100) / 100)
              });
            });

            return {
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 20, containLabel: true },
              xAxis: { type: 'category', data: halfYears },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList
            };
          } catch (e) {
            return { series: [] };
          }

  # ==============================================================================
  # 4. 消费行为热力图与星期分布 (支持成员单选热力图)
  # ==============================================================================
  - name: "Heatmap · 消费热力图 🔥"
    panels:
      - title: 全年每日支出频次与金额热力图 (支持图例单选切换全家/成员打卡)
        type: echarts
        width: 100%
        height: 270px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const allData = await safeQuery("SELECT date, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY date");
            const allPoints = allData.map(r => [r.date, Math.abs(Math.round(parseNum(r.total) * 100) / 100)]);

            const seriesList = [{
              name: '👨‍👩‍👧‍👦 全家总热力',
              type: 'heatmap',
              coordinateSystem: 'calendar',
              data: allPoints
            }];

            const rawData = await safeQuery("SELECT date, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY date, owner");

            members.forEach(m => {
              const mPoints = rawData
                .filter(r => (r.owner || '').toLowerCase() === m.toLowerCase())
                .map(r => [r.date, Math.abs(Math.round(parseNum(r.total) * 100) / 100)]);

              seriesList.push({
                name: `👤 ${m}`,
                type: 'heatmap',
                coordinateSystem: 'calendar',
                data: mPoints
              });
            });

            return {
              tooltip: { position: 'top', formatter: (p) => `${p.seriesName}<br/>${p.value[0]} 支出: ¥${p.value[1]}` },
              // ⭐️ 单选切换器：点击谁就切换到谁的热力图！
              legend: {
                top: 5,
                left: 'center',
                selectedMode: 'single',
                textStyle: { fontSize: 11 }
              },
              visualMap: {
                min: 0,
                max: 1000,
                type: 'piecewise',
                orient: 'horizontal',
                right: 30,
                top: 5,
                textStyle: { fontSize: 11 },
                inRange: { color: ['#dbeafe', '#93c5fd', '#3b82f6', '#1d4ed8'] }
              },
              calendar: {
                top: 75,
                left: 30,
                right: 30,
                range: '2026',
                cellSize: ['auto', 15],
                splitLine: { show: true, lineStyle: { color: '#f3f4f6' } },
                yearLabel: { show: false },
                dayLabel: { firstDay: 1, nameMap: 'cn' }
              },
              series: seriesList
            };
          } catch (e) {
            return { series: [] };
          }

      # --- 4.2 星期画像 (按家庭成员对比/图例筛选) ---
      - title: 周期消费行为画像 (按成员图例过滤/周一~周日消费对比)
        type: echarts
        width: 100%
        height: 330px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const data = await safeQuery("SELECT date, owner, sum(cost(position)) as total WHERE account ~ '^Expenses' GROUP BY date, owner");
            const orderedNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const memberColors = ['#f59e0b', '#ec4899', '#3b82f6', '#10b981'];

            const seriesList = members.map((m, idx) => {
              const dayTotals = [0, 0, 0, 0, 0, 0, 0];
              data.filter(r => (r.owner || '').toLowerCase() === m.toLowerCase()).forEach(r => {
                const d = new Date(r.date);
                dayTotals[d.getDay()] += Math.abs(parseNum(r.total));
              });
              const vals = [dayTotals[1], dayTotals[2], dayTotals[3], dayTotals[4], dayTotals[5], dayTotals[6], dayTotals[0]].map(v => Math.round(v * 100) / 100);

              return {
                name: `👤 ${m}`,
                type: 'bar',
                barMaxWidth: 24,
                data: vals,
                itemStyle: { color: memberColors[idx % memberColors.length], borderRadius: [3, 3, 0, 0] }
              };
            });

            return {
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 25, containLabel: true },
              xAxis: { type: 'category', data: orderedNames },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList.length ? seriesList : [{ type: 'bar', data: [0, 0, 0, 0, 0, 0, 0] }]
            };
          } catch (e) {
            return { series: [] };
          }
