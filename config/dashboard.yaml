dashboards:
  # ==============================================================================
  # 1. 资产与净值总览大屏
  # ==============================================================================
  - name: "Assets · 资产总览 ✨"
    panels:
      # --- 1.1 资产净值走势 ---
      - title: 资产净值走势 (支持家庭总览/个人任意勾选对比)
        type: echarts
        width: 100%
        height: 380px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets|^Liabilities'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const totalData = await safeQuery("SELECT date, sum(cost(position)) as total WHERE account ~ '^Assets|^Liabilities' GROUP BY date ORDER BY date");
            const dates = totalData.length > 0 ? totalData.map(r => r.date) : ['今日'];
            const totalValues = totalData.length > 0 ? totalData.map(r => Math.round(parseNum(r.total) * 100) / 100) : [0];

            const seriesList = [{
              name: '👨‍👩‍👧‍👦 家庭总额',
              type: 'line',
              smooth: true,
              showSymbol: true,
              symbolSize: 8,
              data: totalValues,
              lineStyle: { width: 3, color: '#3b82f6' },
              itemStyle: { color: '#2563eb' }
            }];

            const memberColors = ['#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316'];

            for (let i = 0; i < members.length; i++) {
              const m = members[i];
              const mData = await safeQuery(`SELECT date, sum(cost(position)) as total WHERE account ~ '^Assets:${m}|^Liabilities:${m}' GROUP BY date ORDER BY date`);
              const mValues = dates.map(d => {
                const row = mData.find(r => r.date === d);
                return row ? Math.round(parseNum(row.total) * 100) / 100 : 0;
              });

              seriesList.push({
                name: `👤 ${m}`,
                type: 'line',
                smooth: true,
                showSymbol: true,
                symbolSize: 6,
                data: mValues,
                lineStyle: { width: 2, color: memberColors[i % memberColors.length] },
                itemStyle: { color: memberColors[i % memberColors.length] }
              });
            }

            return {
              tooltip: { trigger: 'axis' },
              legend: {
                top: 5,
                right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }],
                selectorPosition: 'end'
              },
              grid: { left: '3%', right: '4%', top: 55, bottom: 25, containLabel: true },
              xAxis: { type: 'category', boundaryGap: false, data: dates },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList
            };
          } catch (e) {
            return { series: [] };
          }

      # --- 1.2 各渠道资产分布 (带成员图例与筛选) ---
      - title: 资产机构与各成员分布 (支持图例按成员过滤)
        type: echarts
        width: 50%
        height: 350px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Assets'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const accData = await safeQuery("SELECT root(account, 3) as acc, sum(cost(position)) as total WHERE account ~ '^Assets' GROUP BY acc");
            const channels = Array.from(new Set(accData.map(r => r.acc.split(':')[2]).filter(Boolean)));

            const memberColors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
            const seriesList = members.map((m, idx) => {
              const dataVals = channels.map(ch => {
                const row = accData.find(r => r.acc === `Assets:${m}:${ch}`);
                return row ? Math.abs(Math.round(parseNum(row.total) * 100) / 100) : 0;
              });
              return {
                name: `👤 ${m}`,
                type: 'bar',
                stack: 'totalAssets',
                barMaxWidth: 30,
                itemStyle: { color: memberColors[idx % memberColors.length] },
                data: dataVals
              };
            });

            return {
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: {
                top: 5, right: 'center',
                selector: [{ type: 'all', title: '全选' }, { type: 'inverse', title: '反选' }]
              },
              grid: { left: '3%', right: '4%', top: 50, bottom: 25, containLabel: true },
              xAxis: { type: 'category', data: channels.length ? channels : ['暂无'] },
              yAxis: { type: 'value', axisLabel: { formatter: '¥{value}' } },
              series: seriesList.length ? seriesList : [{ type: 'bar', data: [0] }]
            };
          } catch (e) {
            return { series: [] };
          }

      # --- 1.3 负债与未结清账款 (带成员图例与筛选) ---
      - title: 负债机构分布 (按成员堆叠/图例筛选)
        type: echarts
        width: 50%
        height: 350px
        script: |
          try {
            const safeQuery = async (bql) => {
              try { const r = await fava.query(bql); return Array.isArray(r) ? r : []; } catch (e) { return []; }
            };
            const parseNum = (v) => {
              if (v == null) return 0;
              if (typeof v === 'number') return v;
              if (typeof v === 'string') return parseFloat(v.replace(/[^\d.-]/g, '')) || 0;
              if (typeof v === 'object') { const k = Object.keys(v); return k.length ? parseNum(v[k[0]]) : 0; }
              return 0;
            };

            const memData = await safeQuery("SELECT DISTINCT root(account, 2) as acc WHERE account ~ '^Liabilities'");
            const members = Array.from(new Set(memData.map(r => r.acc.split(':')[1]).filter(Boolean))).sort();

            const liaData = await safeQuery("SELECT root(account, 3) as acc, sum(cost(position)) as total WHERE account ~ '^Liabilities' GROUP BY acc");
            const channels = Array.from(new Set(liaData.map(r => r.acc.split(':')[2]).filter(Boolean)));

            const memberColors = ['#f43f5e', '#f97316', '#a855f7', '#6366f1'];
            const seriesList = members.map((m, idx) => {
              const dataVals = channels.map(ch => {
                const row = liaData.find(r => r.acc === `Liabilities:${m}:${ch}`);
                return row ? Math.abs(Math.round(parseNum(row.total) * 100) / 100) : 0;
              });
              return {
                name: `👤 ${m}`,
                type: 'bar',
                stack: 'totalDebt',
                barMaxWidth: 30,
                itemStyle: { color: memberColors[idx % memberColors.length] },
                data: dataVals
